<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Report Template Filler — Live Demo</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #0d1117; color: #e6edf3; }
  h1 { font-size: 1.4em; }
  h2 { font-size: 1em; color: #8b949e; margin-top: 20px; border-bottom: 1px solid #30363d; padding-bottom: 4px; }
  input[type=text], textarea { width: 100%; background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 8px; box-sizing: border-box; margin-top: 4px; font-family: inherit; }
  label { display: block; margin-top: 10px; font-size: 0.9em; color: #8b949e; }
  button { background: #238636; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 1em; cursor: pointer; margin-top: 18px; margin-right: 8px; }
  button.secondary { background: #30363d; }
  pre { background: #161b22; padding: 15px; border-radius: 6px; white-space: pre-wrap; margin-top: 15px; }
  .copied { color: #3fb950; font-size: 0.85em; margin-left: 8px; }
</style>
</head>
<body>

<h1>Report Template Filler — Live Demo</h1>
<p>A sample report template is pre-loaded below. Fill in the fields and generate a consistently formatted report. Runs entirely in your browser — nothing is saved or uploaded.</p>

<div id="form"></div>

<button onclick="generateReport()">Generate Report</button>
<button class="secondary" onclick="copyReport()">Copy Report</button>
<span class="copied" id="copiedMsg" style="display:none;">Copied ✓</span>

<pre id="output"></pre>

<script>
const template = {
  title: "Case Investigation Report",
  sections: [
    { heading: "Case Information", fields: ["case_id", "date_opened", "investigator"] },
    { heading: "Account Summary", fields: ["account_holder", "account_age", "account_status"] },
    { heading: "Findings", fields: ["summary", "key_observations"] },
    { heading: "Disposition", fields: ["outcome", "next_steps"] }
  ]
};

const sampleAnswers = {
  case_id: "CASE-DEMO-0091",
  date_opened: "2026-03-02",
  investigator: "J. Rivera",
  account_holder: "Jane Q. Example",
  account_age: "14 months",
  account_status: "Active, restricted",
  summary: "Account exhibited a pattern of address and contact info changes.",
  key_observations: "Two email changes and one address change within a single week.",
  outcome: "Escalated for further review",
  next_steps: "Await compliance response"
};

function buildForm() {
  const container = document.getElementById('form');
  let html = '';
  template.sections.forEach(section => {
    html += `<h2>${section.heading}</h2>`;
    section.fields.forEach(field => {
      const label = field.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const value = sampleAnswers[field] || '';
      html += `<label>${label}</label><textarea data-field="${field}" rows="1">${value}</textarea>`;
    });
  });
  container.innerHTML = html;
}

function getAnswers() {
  const answers = {};
  document.querySelectorAll('#form [data-field]').forEach(el => {
    answers[el.dataset.field] = el.value.trim();
  });
  return answers;
}

function buildReportText() {
  const answers = getAnswers();
  let out = `# ${template.title}\n\n`;
  out += `Generated: ${new Date().toISOString()}\n\n`;
  template.sections.forEach(section => {
    out += `## ${section.heading}\n`;
    section.fields.forEach(field => {
      const label = field.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const value = answers[field] || '_Not provided_';
      out += `**${label}:** ${value}\n`;
    });
    out += '\n';
  });
  return out;
}

function generateReport() {
  document.getElementById('output').textContent = buildReportText();
}

function copyReport() {
  navigator.clipboard.writeText(buildReportText()).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.style.display = 'inline';
    setTimeout(() => msg.style.display = 'none', 1500);
  });
}

buildForm();
generateReport();
</script>

</body>
</html>
